name: Plan

# Only run when a PR actually touches something that affects the deploy —
# no point spinning up a runner for a README typo fix.
on:
  pull_request:
    branches: [main]
    paths:
      - "opentofu/**"
      - "src/**"
      - "frontend/**"
      - ".github/workflows/plan.yml"

# id-token: write is the OIDC-specific one — it's what lets this job request
# a signed token from GitHub's OIDC provider at all. Everything else stays
# at the default (no write access to repo contents, issues, etc.).
permissions:
  id-token: write
  contents: read

# A second push to the same PR cancels the still-running plan from the
# first push — no point finishing a plan against code that's already stale.
concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Static IaC scan — gates the plan on insecure resource
      # configuration before any AWS credentials are even requested.
      # Pinned to the exact release (not a floating major tag) so CI
      # behavior doesn't drift out from under .checkov.yaml, same
      # reasoning as the tofu_version pin below. Accepted-risk findings
      # live in .checkov.yaml (repo-wide) and inline `checkov:skip`
      # comments (resource-specific) — see that file for the why.
      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12.3114.0
        with:
          directory: opentofu
          config_file: .checkov.yaml
          framework: terraform
          output_format: cli
          compact: true
          quiet: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/layers/skyfield/requirements.txt

      # Rebuilds the Skyfield layer zip that opentofu/lambda_api.tf expects
      # at src/layers/skyfield/dist/skyfield-layer.zip. Locally this is a
      # manual step Derek runs before `tofu plan`; in CI it has to happen
      # every run since dist/ is gitignored and the runner starts clean.
      - name: Build Skyfield layer
        run: python src/layers/skyfield/build.py

      # Exchanges GitHub's OIDC token for temporary AWS credentials by
      # assuming sattrack-gha-plan — read-only, repo-scoped. No AWS keys
      # anywhere in this repo's secrets.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::351668480009:role/sattrack-gha-plan
          aws-region: us-east-1

      # Pinned, not "latest" — bump this deliberately alongside the local
      # install so `tofu` behaves identically in CI and on Derek's machine,
      # rather than the two silently drifting apart.
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.11.5"

      - name: tofu init
        working-directory: opentofu
        run: tofu init

      # Writes the human-readable plan straight into the job summary tab
      # (visible on the PR's checks) instead of posting a PR comment — one
      # less permission (no pull-requests: write) for a first pass.
      # set -o pipefail: without it, `tofu plan | tee` reports tee's exit
      # code (always 0), so a genuinely broken plan would still show this
      # step — and the whole job — as green.
      - name: tofu plan
        working-directory: opentofu
        shell: bash
        env:
          # Same value as the gitignored cesium.auto.tfvars Derek uses
          # locally — without it, CI would plan/apply an empty token and
          # blank out the live globe's Cesium imagery.
          TF_VAR_cesium_ion_token: ${{ secrets.CESIUM_ION_TOKEN }}
        run: |
          set -o pipefail
          tofu plan -no-color -input=false | tee plan.txt
          {
            echo '## tofu plan'
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
