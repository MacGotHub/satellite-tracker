name: Apply

# Fires after a merge lands on main — this is the only trigger that can
# produce the OIDC sub claim sattrack-gha-apply's trust policy requires
# (repo:MacGotHub/satellite-tracker:ref:refs/heads/main).
on:
  push:
    branches: [main]
    paths:
      - "opentofu/**"
      - "src/**"
      - "frontend/**"
      - ".github/workflows/apply.yml"

permissions:
  id-token: write
  contents: read

# Applies never overlap or get cancelled mid-flight — queue instead, so two
# rapid merges to main can't race each other against the same state file.
concurrency:
  group: sattrack-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same scan as plan.yml, run again here so a direct push to main
      # (bypassing a PR) can't apply an insecure change unreviewed —
      # plan.yml gates PRs, this gates the thing that actually mutates AWS.
      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12.3114.0
        with:
          directory: opentofu
          config_file: .checkov.yaml
          framework: terraform
          output_format: cli
          compact: true
          quiet: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/layers/skyfield/requirements.txt

      - name: Build Skyfield layer
        run: python src/layers/skyfield/build.py

      # Assumes sattrack-gha-apply — the one role with write permissions,
      # only reachable because this run's OIDC token proves ref = main.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::351668480009:role/sattrack-gha-apply
          aws-region: us-east-1

      # Pinned to match plan.yml and Derek's local install, so `tofu`
      # behaves identically everywhere.
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.11.5"

      - name: tofu init
        working-directory: opentofu
        run: tofu init

      # set -o pipefail: same reasoning as plan.yml, but more important
      # here — an apply that fails partway through must show as failed,
      # not silently green from tee's exit code.
      - name: tofu apply
        working-directory: opentofu
        shell: bash
        env:
          # Same value as the gitignored cesium.auto.tfvars Derek uses
          # locally — without it, this would blank out the live globe's
          # Cesium imagery on the next apply.
          TF_VAR_cesium_ion_token: ${{ secrets.CESIUM_ION_TOKEN }}
        run: |
          set -o pipefail
          tofu apply -no-color -input=false -auto-approve | tee apply.txt
          {
            echo '## tofu apply'
            echo '```'
            cat apply.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
